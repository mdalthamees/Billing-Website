<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator Login | HI-5 POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static',filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 440px">
    <section class="panel">
      <h1 class="h4">HI-5 Administrator</h1>
      <p class="muted">Sign in to manage the point-of-sale system.</p>
      {% with messages=get_flashed_messages(with_categories=true) %}
        {% for category,message in messages %}
          <div class="alert alert-{{category}}" role="alert">{{message}}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
        <label class="form-label" for="admin-password">Administrator password</label>
        <input class="form-control mb-3" id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="btn btn-danger w-100" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
