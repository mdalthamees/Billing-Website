{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>New Billing</h1><p>One bill can include footwear and dress products</p></div><span class="pill">No GST · Simple retail bill</span></div>
<div class="billing-layout"><section><div class="panel"><div class="row g-2"><div class="col-8"><input id="search" class="form-control form-control-lg" placeholder="Search product name or code..."></div><div class="col-4"><select id="dept" class="form-select form-select-lg"><option value="">All</option><option>Footwear</option><option>Dress</option></select></div></div><div id="productResults" class="product-results" aria-live="polite"><p class="muted">Search to find products.</p></div></div></section>
<section><div class="panel"><h5>Current Bill</h5><div class="row g-2 mb-3"><div class="col-6"><input id="customerName" class="form-control" placeholder="Customer name"></div><div class="col-6"><input id="customerPhone" class="form-control" placeholder="Phone number" inputmode="tel"></div></div><div id="cartItems"><p class="muted">No items added yet.</p></div><hr><div class="d-flex justify-content-between"><span>Subtotal</span><b id="subtotal">₹0.00</b></div><div class="row align-items-center mt-2"><label class="col-6">Discount (₹)</label><div class="col-6"><input id="discount" class="form-control" type="number" min="0" value="0"></div></div><div class="d-flex justify-content-between total-line"><span>Grand Total</span><strong id="total">₹0.00</strong></div><div class="row g-2 mt-2"><div class="col-6"><label class="form-label">Amount Received</label><input id="received" type="number" min="0" value="0" class="form-control"></div><div class="col-6"><label class="form-label">Payment Method</label><select id="method" class="form-select"><option>Cash</option><option>UPI</option><option>Card</option></select></div></div><div class="d-flex justify-content-between mt-3"><span>Balance Due</span><b class="text-danger" id="balance">₹0.00</b></div><button class="btn btn-danger btn-lg w-100 mt-3" id="generate">Generate Bill</button></div></section></div>
{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='receipt-sharing.js')}}"></script><script src="{{url_for('static',filename='billing.js')}}"></script>{% endblock %}
